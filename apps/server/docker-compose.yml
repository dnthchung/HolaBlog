name: holablog

services:
  postgres:
    image: postgres:16
    container_name: holablog-postgres
    environment:
      POSTGRES_DB: holablog
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - holablog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d holablog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  holablog_postgres_data:
