name: holablog

services:
  mysql:
    image: mysql:8.0
    container_name: holablog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: holablog
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - holablog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  holablog_mysql_data:
